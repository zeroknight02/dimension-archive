<script>
/* 启动自检：模块加载失败（断网、缓存残缺、直接用 file:// 打开）时给自救面板 */
(function () {
  var shown = false;
  function panel(msg) {
    if (shown || window.__BOOT_OK) return;
    shown = true;
    if (document.getElementById('boot-fix')) return;
    var box = document.createElement('div');
    box.id = 'boot-fix';
    box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#17132F;color:#F2EDFF;' +
      'box-sizing:border-box;padding:56px 26px;text-align:center;' +
      'font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;';
    box.innerHTML =
      '<div style="font-size:19px;font-weight:600;margin-bottom:12px">页面没加载完整</div>' +
      '<div style="font-size:14px;color:#9C93B8;margin-bottom:28px">' + msg +
      '<br>先点「重试」；还不行再点「清除缓存重试」。<br>记录存在本机数据库，清缓存不会删除数据。</div>' +
      '<button id="boot-retry" style="display:block;width:100%;max-width:320px;margin:0 auto 12px;' +
      'padding:13px 0;border:0;border-radius:14px;background:#7658D6;color:#fff;font-size:16px;' +
      'font-family:inherit;font-weight:600">重试</button>' +
      '<button id="boot-clear" style="display:block;width:100%;max-width:320px;margin:0 auto;' +
      'padding:13px 0;border:1px solid rgba(242,237,255,.18);border-radius:14px;background:#211B40;color:#C9BEE8;' +
      'font-size:16px;font-family:inherit">清除缓存重试</button>';
    document.body.appendChild(box);
    document.getElementById('boot-retry').addEventListener('click', function () { location.reload(); });
    document.getElementById('boot-clear').addEventListener('click', function () {
      var btn = this; btn.disabled = true; btn.textContent = '正在清理…';
      var jobs = [];
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      }
      Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
    });
  }
  window.__bootFailed = panel;
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'SCRIPT') panel('脚本没能加载，多半是网络中断或本地缓存损坏。');
  }, true);
  setTimeout(function () {
    if (!window.__BOOT_OK) {
      panel(location.protocol === 'file:'
        ? '当前是直接打开本地文件，浏览器会拦截模块加载。'
        : '应用没能启动，可能是缓存不完整。');
    }
  }, 10000);
})();
</script>
